 if(op==='union'){a.clipTo(b);b.clipTo(a);b.invert();b.clipTo(a);b.invert();a.build(b.all());return a.all()}
 if(op==='subtract'){a.invert();a.clipTo(b);b.clipTo(a);b.invert();b.clipTo(a);b.invert();a.build(b.all());a.invert();return a.all()}
 a.invert();b.clipTo(a);b.invert();a.clipTo(b);b.clipTo(a);a.build(b.all());a.invert();return a.all()
}
function __groupPolys(g){
 const polys=[];F.filter(f=>(f.g||0)===g).forEach(f=>{const pts=f.v.map(i=>V[i]);if(pts.length>=3)polys.push(pts)});return polys
}
function __solidCheck(polys){
 if(!polys.length)return 'No faces found';
 const edges=new Map();
 polys.forEach(p=>p.forEach((v,i)=>{const w=p[(i+1)%p.length],a=v.map(x=>x.toFixed(4)).join(','),b=w.map(x=>x.toFixed(4)).join(','),k=a<b?a+'|'+b:b+'|'+a;edges.set(k,(edges.get(k)||0)+1)}));
 const open=[...edges.values()].filter(n=>n!==2).length;
 return open?'Warning: '+open+' boundary/non-manifold edges. Results may be unreliable.':'Closed edge topology detected';
}
function __booleanUI(op){
 const ga=Number(prompt('First solid layer/group ID','21'));if(!Number.isInteger(ga))return;
 const gb=Number(prompt('Second solid layer/group ID','22'));if(!Number.isInteger(gb)||ga===gb)return;
 const A=__groupPolys(ga),B=__groupPolys(gb);if(!A.length||!B.length)return tip('Both group IDs must contain faces');
 const checkA=__solidCheck(A),checkB=__solidCheck(B);
 if((checkA.startsWith('Warning')||checkB.startsWith('Warning'))&&!confirm(checkA+'\n'+checkB+'\n\nContinue with approximate/unreliable Boolean result?'))return;
 try{
  const out=__boolean(A,B,op);if(!out.length)return tip('Boolean result is empty');
  const g=Number(prompt('Output group ID','23'));if(!Number.isInteger(g))return;
  mark();F=F.filter(f=>(f.g||0)!==ga&&(f.g||0)!==gb);
  out.forEach(p=>{const ids=p.map(addV),uniq=[...new Set(ids)];if(uniq.length>=3){const f={v:uniq,g};F.push(f);bdry(f)}});
  E=new Set();F.forEach(bdry);sel.clear();rebuild();tip('Boolean '+op+' complete: '+out.length+' polygons');
 }catch(e){console.error(e);tip('Boolean failed: check closed, overlapping solids')}
}

}

function __window(){

 makeBox(p.x+t,sill+h/2-t*.35,p.z+t*.1,w-2*t,t*.7,t*.55,__activeGroup,frame);

function __floor(){

function __stats(){
 if(!V.length)return tip('Model is empty');
 const mn=[Infinity,Infinity,Infinity],mx=[-Infinity,-Infinity,-Infinity];
 V.forEach(p=>p.forEach((v,i)=>{mn[i]=Math.min(mn[i],v);mx[i]=Math.max(mx[i],v)}));
 const dims=mx.map((v,i)=>(v-mn[i]).toFixed(2));
 const groups={};F.forEach(f=>groups[f.g||0]=(groups[f.g||0]||0)+1);
 alert('SKETCHLAB MODEL REPORT\n\nVertices: '+V.length+'\nEdges: '+E.size+'\nFaces: '+F.length+'\nBounds X × Y × Z: '+dims.join(' × ')+' '+unitName+'\nGroups: '+Object.entries(groups).map(([g,n])=>(__layerNames[g]||('Group '+g))+': '+n+' faces').join('\n'));
}
function __layers(){
 const lines=Object.entries(__layerNames).map(([k,v])=>k+': '+v+(window.__sketchHiddenGroups.has(+k)?' [hidden]':'')).join('\n');
 const action=prompt('Layer manager\n'+lines+'\n\nType: hide 0 / show 0 / assign 1 / rename 1 New name / active 2','active '+__activeGroup);
 if(!action)return;const a=action.trim().split(/\s+/),cmd=a.shift(),id=Number(a.shift());
 if(!Number.isInteger(id)||id<0||id>99)return tip('Invalid layer number');
 if(cmd==='hide')window.__sketchHiddenGroups.add(id);
 else if(cmd==='show')window.__sketchHiddenGroups.delete(id);
 else if(cmd==='active'){__activeGroup=id;tip('Active layer: '+(__layerNames[id]||('Layer '+id)));return}
 else if(cmd==='rename'){const name=a.join(' ');if(!name)return;__layerNames[id]=name;localStorage.setItem('sketchlab.layers',JSON.stringify(__layerNames))}
 else if(cmd==='assign'){if(!sel.size)return tip('Select faces first');mark();sel.forEach(fi=>{if(F[fi])F[fi].g=id});sel.clear()}
 else return tip('Use hide, show, assign, rename or active');
 localStorage.setItem('sketchlab.layers',JSON.stringify(__layerNames));rebuild();tip('Layer settings updated');
}
function __importOBJ(file){
 const reader=new FileReader();reader.onload=()=>{try{
  const vs=[],fs=[],lines=String(reader.result).split(/\r?\n/);
  lines.forEach(line=>{const s=line.trim().split(/\s+/);if(s[0]==='v'&&s.length>=4){const p=s.slice(1,4).map(Number);if(p.every(Number.isFinite))vs.push(p)}
   else if(s[0]==='f'&&s.length>=4){const ids=s.slice(1).map(t=>{const n=parseInt(t.split('/')[0],10);return n<0?vs.length+n:n-1});if(ids.every(i=>i>=0&&i<vs.length))fs.push(ids)}});
  if(!vs.length||!fs.length)throw Error('No mesh faces found');
  mark();const offset=vs.map(p=>addV(p));fs.forEach(ids=>{const f={v:ids.map(i=>offset[i]),g:__activeGroup};F.push(f);bdry(f)});rebuild();tip('OBJ imported: '+fs.length+' faces');
 }catch(e){tip('OBJ import failed: check the file format')}};reader.readAsText(file);
}

 if(!V.length)return tip('Model is empty');
 const mn=[Infinity,Infinity,Infinity],mx=[-Infinity,-Infinity,-Infinity];
 V.forEach(p=>p.forEach((v,i)=>{mn[i]=Math.min(mn[i],v);mx[i]=Math.max(mx[i],v)}));
 const rows=[['Overall X',mx[0]-mn[0]],['Overall Y / height',mx[1]-mn[1]],['Overall Z',mx[2]-mn[2]]];
 const text='Dimension report ('+unitName+')\n'+rows.map(([n,v])=>n+': '+v.toFixed(3)).join('\n');

}
